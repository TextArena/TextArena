[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TextArena"
version = "0.7.3"
description = "A Collection of Competitive Text-Based Games for Language Model Evaluation and Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Leon Guertler", email="Guertlerlo@cfar.a-star.edu.sg"},]
dependencies = ["openai", "rich", "nltk", "chess", "python-dotenv", "requests", "websockets"]

[project.urls]
"Homepage" = "https://www.textarena.ai/"

[project.optional-dependencies]
all = ["sympy", "latex2sympy", "openai", "google-genai", "transformers", "cerebras-cloud-sdk", "boto3", "anthropic"]
# Word games in non-English languages need per-language word data. wordfreq
# (Apache-2.0) covers all supported languages; it is optional so the core
# install stays lean and English word games work with no extra dependency.
wordgames = ["wordfreq"]


