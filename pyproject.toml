[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TextArena"
version = "0.7.3"
description = "A Collection of Competitive Text-Based Games for Language Model Evaluation and Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Leon Guertler", email = "Guertlerlo@cfar.a-star.edu.sg"},
    {name = "Bobby Cheng", email = "bobbycxy1994@gmail.com"},
]
dependencies = []

[project.urls]
"Homepage" = "https://www.textarena.ai/"

[project.optional-dependencies]
agents = ["openai"]
render = ["rich"]
translations = ["textarena-locales"]
all = ["openai", "rich", "textarena-locales", "tinker; python_version >= '3.11'"]
test = ["pytest", "chess", "openai", "rich"]  # python-chess is only a reference oracle for the Chess rules tests

[tool.setuptools.packages.find]
include = ["textarena*"]  # locales/ is the separate textarena-locales distribution

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

