[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TextArena"
version = "1.0.0"
description = "108 single-, two-, and multi-player text games for evaluating and training LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Leon Guertler", email = "Guertlerlo@cfar.a-star.edu.sg"},
    {name = "Bobby Cheng", email = "bobbycxy1994@gmail.com"},
]
keywords = ["llm", "agents", "games", "benchmark", "reinforcement-learning", "self-play", "multi-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
"Homepage" = "https://www.textarena.ai/"
"Repository" = "https://github.com/TextArena/TextArena"
"Changelog" = "https://github.com/TextArena/TextArena/blob/main/CHANGELOG.md"
"Paper" = "https://arxiv.org/abs/2504.11442"

[project.optional-dependencies]
agents = ["openai"]
render = ["rich"]
translations = ["textarena-locales>=1.0"]
all = ["openai", "rich", "textarena-locales>=1.0", "tinker; python_version >= '3.11'"]
test = ["pytest", "chess", "openai", "rich"]  # python-chess is only a reference oracle for the Chess rules tests

[tool.setuptools.packages.find]
include = ["textarena*"]  # locales/ is the separate textarena-locales distribution

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

